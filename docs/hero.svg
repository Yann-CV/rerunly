<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="h-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121a3d"/>
      <stop offset="1" stop-color="#2a1f5e"/>
    </linearGradient>
    <linearGradient id="h-bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3987e5"/>
      <stop offset="1" stop-color="#6250d6"/>
    </linearGradient>
    <filter id="h-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
    <filter id="h-glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="8"/></filter>
    <pattern id="h-dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#fff" opacity=".07"/></pattern>
    <marker id="h-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="15" markerHeight="15" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#fff" opacity=".55"/>
    </marker>
    <clipPath id="h-clip"><rect width="1200" height="440" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#h-clip)">
    <rect width="1200" height="440" fill="url(#h-bg)"/>
    <rect width="1200" height="440" fill="url(#h-dots)"/>
    <circle cx="230" cy="90" r="150" fill="#3987e5" opacity=".28" filter="url(#h-blur)"/>
    <circle cx="640" cy="380" r="170" fill="#6250d6" opacity=".35" filter="url(#h-blur)"/>
    <circle cx="1010" cy="120" r="140" fill="#1baf7a" opacity=".2" filter="url(#h-blur)"/>
  </g>

  <!-- 1. you edit a prompt or a skill -->
  <g transform="translate(110 92)">
    <g transform="rotate(-9 90 120)" opacity=".35">
      <rect width="180" height="230" rx="16" fill="#fff"/>
    </g>
    <g transform="rotate(-3 90 120)" opacity=".6">
      <rect width="180" height="230" rx="16" fill="#fff"/>
    </g>
    <g transform="rotate(4 90 120)">
      <rect width="180" height="230" rx="16" fill="#fff"/>
      <text x="20" y="34" font-size="15" font-weight="700" fill="#1b1b1f">SKILL.md</text>
      <rect x="128" y="20" width="34" height="20" rx="10" fill="#e9e6fb"/>
      <text x="145" y="34.5" font-size="12" font-weight="700" fill="#6250d6" text-anchor="middle">v3</text>
      <rect x="20" y="56" width="140" height="8" rx="4" fill="#d9dbe3"/>
      <rect x="20" y="74" width="112" height="8" rx="4" fill="#d9dbe3"/>
      <rect x="14" y="92" width="152" height="20" rx="6" fill="#fde2e2"/>
      <text x="22" y="106.5" font-size="12" font-weight="700" fill="#d14343">−</text>
      <rect x="36" y="98" width="110" height="8" rx="4" fill="#f2a7a7"/>
      <rect x="14" y="118" width="152" height="20" rx="6" fill="#d6f6ea"/>
      <text x="21" y="132.5" font-size="12" font-weight="700" fill="#14895f">+</text>
      <rect x="36" y="124" width="84" height="8" rx="4" fill="#7fd9b5"/>
      <rect x="20" y="152" width="128" height="8" rx="4" fill="#d9dbe3"/>
      <rect x="20" y="170" width="96" height="8" rx="4" fill="#d9dbe3"/>
      <rect x="20" y="188" width="136" height="8" rx="4" fill="#d9dbe3"/>
    </g>
  </g>
  <text x="200" y="384" font-size="17" font-weight="600" fill="#fff" text-anchor="middle">You change a prompt</text>

  <path d="M318 214 C 360 200, 390 200, 432 212" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2.5" stroke-dasharray="6 7" marker-end="url(#h-arrow)"/>

  <!-- 2. the same task, rerun: each run lighter than the last -->
  <g transform="translate(600 214)">
    <circle r="118" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="5"/>
    <path d="M -36.5 -112.2 A 118 118 0 0 1 53.6 -105.1" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="5" stroke-linecap="round" marker-end="url(#h-arrow)"/>
    <text y="-6" font-size="15" fill="#c9cbe0" text-anchor="middle">same task,</text>
    <text y="16" font-size="15" fill="#c9cbe0" text-anchor="middle">rerun</text>

    <circle cx="-102.2" cy="59" r="36" fill="#fff" opacity=".5"/>
    <text x="-102.2" y="64.6" font-size="16" font-weight="700" fill="#1b1b1f" text-anchor="middle">$1.20</text>
    <circle cx="-67.7" cy="-96.7" r="28" fill="#fff" opacity=".85"/>
    <text x="-67.7" y="-91.7" font-size="14" font-weight="700" fill="#1b1b1f" text-anchor="middle">$0.74</text>
    <circle cx="90.4" cy="-75.8" r="30" fill="#7ef0c4" opacity=".55" filter="url(#h-glow)"/>
    <circle cx="90.4" cy="-75.8" r="22" fill="#7ef0c4"/>
    <text x="90.4" y="-71.1" font-size="13" font-weight="700" fill="#0d3b2c" text-anchor="middle">$0.41</text>
  </g>
  <text x="600" y="384" font-size="17" font-weight="600" fill="#fff" text-anchor="middle">You rerun the task</text>

  <path d="M762 212 C 800 200, 830 200, 868 212" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2.5" stroke-dasharray="6 7" marker-end="url(#h-arrow)"/>

  <!-- 3. Rerunly gives the verdict -->
  <g transform="translate(886 98)">
    <rect width="214" height="232" rx="18" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".18"/>
    <rect x="30" y="66" width="34" height="110" rx="6" fill="url(#h-bar)" opacity=".55"/>
    <rect x="90" y="108" width="34" height="68" rx="6" fill="url(#h-bar)" opacity=".8"/>
    <rect x="150" y="138" width="34" height="38" rx="6" fill="#7ef0c4"/>
    <polyline points="47,56 107,98 167,128" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>
    <circle cx="167" cy="128" r="5" fill="#fff"/>
    <rect x="30" y="18" width="154" height="30" rx="15" fill="#7ef0c4"/>
    <text x="107" y="38.5" font-size="15" font-weight="800" fill="#0d3b2c" text-anchor="middle">▼ 66% cheaper</text>
    <rect x="14" y="190" width="186" height="26" rx="13" fill="#fff" fill-opacity=".12"/>
    <text x="107" y="208" font-size="13.5" font-weight="600" fill="#e8e9f5" text-anchor="middle">▼ 41% faster · −58% tokens</text>
  </g>
  <text x="993" y="384" font-size="17" font-weight="600" fill="#fff" text-anchor="middle">You see if it paid off</text>
</svg>
