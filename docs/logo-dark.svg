<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" width="560" height="120">
  <g transform="translate(4 12) scale(1.5)">
  <defs>
    <linearGradient id="rerunly-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3987e5"/>
      <stop offset="1" stop-color="#6250d6"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#rerunly-bg)"/>
  <!-- a task goes round again and again; each rerun lighter than the last, the bright one is the latest -->
  <circle cx="32" cy="32" r="17" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="3"/>
  <circle cx="17.28" cy="40.50" r="9" fill="#fff" opacity=".55"/>
  <circle cx="26.19" cy="16.03" r="6.5" fill="#fff" opacity=".85"/>
  <circle cx="47.41" cy="24.82" r="5" fill="#7ef0c4"/>
</g>
  <text x="122" y="66" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="50" font-weight="750" letter-spacing="-1.5" fill="#f4f4f6">rerun<tspan fill="#3987e5">ly</tspan></text>
  <text x="124" y="96" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#a6a6b2">Did your prompt change pay off? Rerun and see.</text>
</svg>
