# Linting before each commit: `uv run pre-commit install` (once), or on demand: `uv run pre-commit run --all-files`.
# Ruff and Pyright run from the project environment, so they use the versions pinned in uv.lock, as CI does.
# Vendored, minified third-party files are kept byte for byte.
exclude: ^rerunly/static/chart-.*\.min\.js$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --locked ruff check --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: pyright
        name: pyright
        entry: uv run --locked pyright
        language: system
        types_or: [python, pyi]
        pass_filenames: false
        require_serial: true
