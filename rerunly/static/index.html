<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rerunly</title>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/chart-4.4.1.umd.min.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/"><img src="/static/icon.svg" alt="" width="24" height="24">Rerunly</a>
    <nav>
      <a href="#/" data-nav="home">Home</a>
      <a href="#/prompts" data-nav="prompts">Prompts</a>
      <a href="#/sessions" data-nav="sessions">Sessions</a>
      <a href="#/tags" data-nav="tags">Tags</a>
      <a href="#/reruns" data-nav="reruns">Reruns <span id="rerun-queue-count" class="nav-count" aria-hidden="true" hidden></span></a>
      <a href="#/setup" data-nav="setup">Setup</a>
    </nav>
    <div class="segmented cost-switch" role="group" aria-label="Cost shown">
      <button type="button" data-cost-source="claude-code"
        title="Cost reported by the agent itself (OpenTelemetry) for prompts it fully covers; the price table for the others">Official</button>
      <button type="button" data-cost-source="prices" title="Token counts × the price table configured on the Setup page">Price table</button>
    </div>
    <button id="usage-reopen" class="btn" type="button" hidden>Show usage</button>
    <button id="refresh" class="btn" title="Import new transcripts now">Refresh</button>
    <button id="sign-out" class="btn" type="button" hidden>Sign out</button>
  </header>
  <main id="app"></main>
  <aside id="usage-panel" class="hero-limits" aria-label="Usage limits" hidden>
    <div class="usage-panel-controls"><button id="usage-drag" type="button" aria-label="Move usage panel" title="Drag to move; use arrow keys to adjust">⠿</button><button id="usage-close" type="button" aria-label="Close usage panel" title="Close usage panel">×</button></div>
    <details open><summary>Usage limits</summary><div class="hero-limits-content"></div></details>
  </aside>
  <script src="/static/app.js"></script>
</body>
</html>
