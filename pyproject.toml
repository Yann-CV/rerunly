[project]
name = "rerunly"
version = "0.1.0"
description = "Rerun a task, see if your prompt change paid off: cost, tokens and time per prompt for AI coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
rerunly = "rerunly.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]
# status bar icon (`rerunly tray`); Qt talks to the desktop's StatusNotifier tray over D-Bus
tray = ["PySide6-Essentials>=6.7"]

[tool.uv]
# `uv sync` / `uv run` install the tray too
default-groups = ["dev", "tray"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rerunly"]
