[project]
name = "agent-dashboard"
version = "0.1.0"
description = "Per-prompt token, cost and time dashboard for AI coding agents (Claude Code first)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.scripts]
agent-dashboard = "agent_dashboard.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_dashboard"]
