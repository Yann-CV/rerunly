<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Task Dashboard</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">Agent Task Dashboard</a>
    <nav>
      <a href="#/" data-nav="prompts">Prompts</a>
      <a href="#/sessions" data-nav="sessions">Sessions</a>
      <a href="#/tags" data-nav="tags">Tags</a>
      <a href="#/setup" data-nav="setup">Setup</a>
    </nav>
    <div class="segmented cost-switch" role="group" aria-label="Cost shown">
      <button type="button" data-cost-source="claude-code"
        title="Cost reported by Claude Code (OpenTelemetry) for prompts it fully covers; the price table for the others">Official</button>
      <button type="button" data-cost-source="prices" title="Token counts × the price table configured on the Setup page">Price table</button>
    </div>
    <button id="refresh" class="btn" title="Import new transcripts now">Refresh</button>
  </header>
  <main id="app"></main>
  <script src="/static/app.js"></script>
</body>
</html>
